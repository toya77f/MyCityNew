<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>My City</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- اللعبة -->
  <div id="game"></div>


  <!-- معلومات اللعبة -->
  <div id="hud">

    <div id="location">
      📍 المدينة
    </div>

    <div id="message"></div>

  </div>


  <!-- زر الخريطة -->
  <button
    id="mapButton"
    class="gameButton"
  >
    🗺️
  </button>


  <!-- الخريطة -->
  <div
    id="mapScreen"
    class="hidden"
  >

    <div id="mapHeader">

      <h2>🗺️ خريطة المدينة</h2>

      <button id="closeMap">
        ✕
      </button>

    </div>

    <div id="map">

      <div class="mapPlace home">
        🏠
        <span>البيت</span>
      </div>

      <div class="mapPlace school">
        🏫
        <span>المدرسة</span>
      </div>

      <div class="mapPlace mall">
        🛍️
        <span>المول</span>
      </div>

      <div class="mapPlace police">
        🚓
        <span>الشرطة</span>
      </div>

      <div
        id="mapPlayer"
        class="mapPlayer"
      >
        🔵
      </div>

    </div>

  </div>


  <!-- أزرار الموبايل -->

  <div id="mobileControls">

    <!-- Joystick -->
    <div id="joystick">

      <div id="joystickStick"></div>

    </div>


    <!-- Jump -->
    <button
      id="jumpButton"
      class="controlButton"
    >
      ⬆️
    </button>


    <!-- Sprint -->
    <button
      id="sprintButton"
      class="controlButton"
    >
      🏃
    </button>

  </div>


  <!-- Three.js -->

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>


  <!-- اللعبة -->

  <script
    type="module"
    src="game.js"
  ></script>

</body>

</html>
